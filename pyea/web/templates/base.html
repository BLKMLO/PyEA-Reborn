<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PyEA{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐍</text></svg>">
  <!-- Libs servies en local (static/vendor) : le dashboard doit fonctionner
       sans accès internet (VPS de trading). Tailwind = style uniquement. -->
  <script src="/static/vendor/tailwind.js"></script>
  <script src="/static/vendor/htmx.min.js"></script>
  <!-- Socle partagé (formats, préférences, tables triables, raccourcis,
       bandeau d'état, horloge UTC) puis toasts et WebSocket : chargés sur
       toutes les pages, dans cet ordre (ui.js n'a aucune dépendance). -->
  <script src="/static/js/ui.js"></script>
  <script src="/static/js/toasts.js"></script>
  <script src="/static/js/websocket.js"></script>
  <style>
    /* Barres de défilement discrètes : les panneaux denses (logs, trades,
       watchlist) sont plus lisibles sans la barre système claire par défaut. */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
    * { scrollbar-width: thin; scrollbar-color: #334155 transparent; }
  </style>
  {% block head %}{% endblock %}
</head>
<body class="h-full overflow-hidden bg-slate-900 text-slate-100">
  <div class="flex h-full flex-col">
    <header class="flex items-center justify-between border-b border-slate-700 bg-slate-800 px-4 py-2">
      <div class="flex items-center gap-4">
        <h1 class="text-lg font-semibold tracking-wide">🐍 PyEA</h1>
        <!-- Bandeau d'état (mode, broker, stratégie, badge DÉMO) : peint par
             ui.js sur les TROIS pages — un broker qui tombe pendant un
             entraînement doit se voir sans revenir sur la page Live. -->
        <span id="header-status" class="text-xs text-slate-400"></span>
      </div>
      <div class="flex items-center gap-3">
        <!-- Horloge UTC : le moteur raisonne en UTC (journée de risque,
             clôture de fin de semaine ISO, horodatage des trades). -->
        <span id="utc-clock" class="font-mono text-xs text-slate-500" title="Heure UTC — référence de PyEA"></span>
        <!-- Rempli par le JS des pages qui ouvrent un WebSocket (live,
             entraînement) ; vide ailleurs — afficher « déconnecté » en dur
             était trompeur sur les pages sans WebSocket. -->
        <span id="ws-status" class="text-xs text-slate-500"></span>
        <!-- Sélecteur d'interface : Live | Backtest | Entraînement -->
        <nav class="flex overflow-hidden rounded-md border border-slate-600 text-sm">
          <a href="/" title="Raccourci : 1" class="border-r border-slate-600 px-3 py-1 {% if page == 'live' %}bg-emerald-600 text-white{% else %}bg-slate-700 text-slate-300 hover:bg-slate-600{% endif %}">Live</a>
          <a href="/backtest" title="Raccourci : 2" class="border-r border-slate-600 px-3 py-1 {% if page == 'backtest' %}bg-emerald-600 text-white{% else %}bg-slate-700 text-slate-300 hover:bg-slate-600{% endif %}">Backtest</a>
          <a href="/training" title="Raccourci : 3" class="px-3 py-1 {% if page == 'training' %}bg-emerald-600 text-white{% else %}bg-slate-700 text-slate-300 hover:bg-slate-600{% endif %}">Entraînement</a>
        </nav>
        <!-- Aide des raccourcis clavier (fenêtre construite par ui.js). -->
        <span class="cursor-help rounded border border-slate-600 px-1.5 py-0.5 font-mono text-[11px] text-slate-500"
              title="Raccourcis clavier — appuyez sur ?">?</span>
      </div>
    </header>
    {% block content %}{% endblock %}
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
